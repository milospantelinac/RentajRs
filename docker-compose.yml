version: "3.9"

name: rentaj

services:
  postgres:
    image: postgres:16-alpine
    container_name: rentaj_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentaj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentaj_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rentaj}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentaj}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rentaj_network

  redis:
    image: redis:7-alpine
    container_name: rentaj_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rentaj_network

  maildev:
    image: maildev/maildev:latest
    container_name: rentaj_maildev
    restart: unless-stopped
    networks:
      - rentaj_network

  adminer:
    image: adminer:latest
    container_name: rentaj_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - rentaj_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production

    container_name: rentaj_backend

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-rentaj}:${POSTGRES_PASSWORD:-rentaj_dev_password}@postgres:5432/${POSTGRES_DB:-rentaj}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: maildev
      SMTP_PORT: 1025

    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - rentaj_network

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 1G
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production

    container_name: rentaj_fronten

    env_file:
      - ./frontend/.env

    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:3001/api/v1}
      NUXT_API_BASE_INTERNAL: http://backend:3001/api/v1

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

    depends_on:
      - backend

    networks:
      - rentaj_network

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  rentaj_network:
    driver: bridge
